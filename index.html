<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow, noai, noimageai" />
		<title>Now Playing</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<div class="card">
			<div class="status">
				<span class="dot" id="dot"></span>
				<span id="statusText">—</span>
			</div>

			<section class="hero">
				<div id="now"><span class="empty">Loading…</span></div>
			</section>

			<section id="queue"></section>

			<footer class="meta">
				<div class="cell">
					<span class="k">TS</span>
					<span class="v" id="s-ts">—</span>
				</div>
				<div class="cell">
					<span class="k">Clients</span>
					<span class="v" id="s-clients">—</span>
				</div>
				<div class="cell">
					<span class="k">CPU</span>
					<span class="v" id="s-cpu">—</span>
				</div>
				<div class="cell">
					<span class="k">RAM</span>
					<span class="v" id="s-ram">—</span>
				</div>
				<div class="cell">
					<span class="k">Disk</span>
					<span class="v" id="s-disk">—</span>
				</div>
				<div class="cell">
					<span class="k">Temp</span>
					<span class="v" id="s-temp">—</span>
				</div>
				<div class="cell">
					<span class="k">Uptime</span>
					<span class="v" id="s-uptime">—</span>
				</div>
				<div class="cell">
					<span class="k">Time</span>
					<span class="v" id="s-clock">—</span>
				</div>
			</footer>
		</div>

		<script>
			const $now = document.getElementById("now");
			const $queue = document.getElementById("queue");
			const $dot = document.getElementById("dot");
			const $statusText = document.getElementById("statusText");

			const esc = (s) =>
				String(s).replace(
					/[&<>"']/g,
					(c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
				);

			const fmt = (sec) => {
				sec = Math.max(0, Math.floor(sec || 0));
				return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
			};

			const fmtUptime = (s) => {
				s = Math.floor(s || 0);
				const d = Math.floor(s / 86400);
				const h = Math.floor((s % 86400) / 3600);
				const m = Math.floor((s % 3600) / 60);
				return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${m}m`;
			};

			const POLL_MS = 5000;
			const STATS_MS = 10000;
			const TICK_MS = 1000;

			let pos = 0;
			let dur = 0;
			let trackId = null;
			let playing = false;

			const pct = () => (dur > 0 ? Math.min(100, (pos / dur) * 100) : 0);

			function renderNow() {
				const np = window.__np;
				if (!np) {
					$now.innerHTML = '<span class="empty">Nothing playing</span>';
					return;
				}
				if (!document.getElementById("pos")) {
					$now.innerHTML = `
      <div class="title">${esc(np.title || "Unknown")}</div>
      ${np.artist ? `<div class="artist">${esc(np.artist)}</div>` : ""}
      <div class="progress">
        <span class="t" id="pos"></span>
        <div class="bar"><span id="bar"></span></div>
        <span class="t" id="dur">${fmt(dur)}</span>
      </div>`;
				}
				document.getElementById("pos").textContent = fmt(pos);
				document.getElementById("bar").style.width = `${pct()}%`;
			}

			function renderQueue(upcoming, total) {
				if (!upcoming?.length) {
					$queue.innerHTML = "";
					return;
				}
				$queue.innerHTML = `
    <div class="queue">
      <h2><span>Up Next</span><span class="count">${total || upcoming.length}</span></h2>
      <ol>
        ${upcoming
					.slice(0, 5)
					.map(
						(i) => `
          <li>
            <div class="q-meta">
              <div class="q-title">${esc(i.title || "Unknown")}</div>
              ${i.artist ? `<div class="q-artist">${esc(i.artist)}</div>` : ""}
            </div>
            ${i.duration ? `<div class="q-dur">${fmt(i.duration)}</div>` : ""}
          </li>`,
					)
					.join("")}
      </ol>
    </div>`;
			}

			function tick() {
				if (!playing || !window.__np) return;
				pos = Math.min(pos + 1, dur);
				document.getElementById("pos").textContent = fmt(pos);
				document.getElementById("bar").style.width = `${pct()}%`;
			}

			async function poll() {
				try {
					const r = await fetch("/data", { cache: "no-store" });
					if (!r.ok) throw 0;
					const d = await r.json();
					const np = d.nowPlaying;
					const id = np ? `${np.title}|${np.artist || ""}` : null;

					if (id !== trackId) {
						trackId = id;
						pos = d.progress?.position ?? 0;
						dur = d.progress?.duration ?? np?.duration ?? 0;
						window.__np = np;
						$now.innerHTML = "";
						renderNow();
						renderQueue(d.upcoming, d.queueLength);
					} else {
						// 2s tolerance absorbs setInterval drift and server jitter without visibly snapping the bar
						const serverPos = d.progress?.position ?? 0;
						if (Math.abs(serverPos - pos) > 2) pos = serverPos;
						dur = d.progress?.duration ?? np?.duration ?? dur;
					}

					playing = d.status === "playing";
					$dot.className = `dot ${playing ? "playing" : d.status === "paused" ? "paused" : ""}`;
					$statusText.textContent = d.status || "idle";
				} catch {
					$now.innerHTML = '<span class="empty">Unavailable</span>';
					$queue.innerHTML = "";
					$dot.className = "dot";
					$statusText.textContent = "—";
					playing = false;
				}
			}

			async function pollStats() {
				try {
					const r = await fetch("/stats", { cache: "no-store" });
					if (!r.ok) throw 0;
					const d = await r.json();
					const el = (id) => document.getElementById(id);

					const tsEl = el("s-ts");
					tsEl.textContent = d.ts?.online ? "online" : "offline";
					tsEl.className = `v ${d.ts?.online ? "ok" : "bad"}`;

					el("s-clients").textContent =
						d.ts?.clients != null ? `${d.ts.clients}${d.ts.maxClients ? "/" + d.ts.maxClients : ""}` : "—";
					el("s-cpu").textContent = d.cpu ? `${d.cpu.percent.toFixed(0)}%` : "—";
					el("s-ram").textContent = d.mem ? `${d.mem.percent.toFixed(0)}%` : "—";
					el("s-disk").textContent = d.disk ? `${d.disk.percent.toFixed(0)}%` : "—";
					el("s-temp").textContent = d.temps?.length
						? d.temps.map((t) => `${t.celsius.toFixed(0)}°`).join("/")
						: "—";
					el("s-uptime").textContent = d.uptime ? fmtUptime(d.uptime.host) : "—";
					el("s-clock").textContent = d.clock
						? new Date(d.clock.iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
						: "—";
				} catch {
					["s-ts", "s-clients", "s-cpu", "s-ram", "s-disk", "s-temp", "s-uptime", "s-clock"].forEach((id) => {
						const e = document.getElementById(id);
						e.textContent = "—";
						e.className = "v";
					});
				}
			}

			poll();
			pollStats();
			setInterval(tick, TICK_MS);
			setInterval(poll, POLL_MS);
			setInterval(pollStats, STATS_MS);
		</script>
	</body>
</html>
