<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow, noai, noimageai" />
		<title>Now Playing</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<div class="card">
			<header class="server">
				<div class="server-side">
					<span class="server-label">TeamSpeak</span>
					<span class="server-status-row">
						<span class="dot" id="dot" data-state="offline"></span>
						<span class="server-status" id="s-ts-text" data-state="bad">—</span>
					</span>
				</div>
				<div class="server-side server-side-right">
					<span class="server-num" id="s-clients">—</span>
					<span class="server-label">online</span>
				</div>
			</header>

			<section class="hero">
				<div id="now">
					<span class="empty" id="np-empty">Loading…</span>
					<div class="np" id="np" hidden>
						<div class="title" id="np-title"></div>
						<div class="artist" id="np-artist"></div>
						<div class="progress">
							<span class="t" id="pos"></span>
							<div class="bar"><span id="bar"></span></div>
							<span class="t" id="dur"></span>
						</div>
					</div>
				</div>
			</section>

			<section id="queue" hidden>
				<div class="queue">
					<h2><span>Up Next</span><span class="count" id="q-count"></span></h2>
					<ol id="q-list"></ol>
				</div>
			</section>

			<section class="resources">
				<div class="cell">
					<span class="k">CPU</span>
					<span class="v" id="s-cpu">—</span>
					<span class="spark" id="s-cpu-spark"></span>
				</div>
				<div class="cell">
					<span class="k">RAM</span>
					<span class="v" id="s-ram">—</span>
					<span class="spark" id="s-ram-spark"></span>
				</div>
				<div class="cell">
					<span class="k">Disk</span>
					<span class="v" id="s-disk">—</span>
					<span class="spark" id="s-disk-spark"></span>
				</div>
			</section>

			<section class="meta">
				<div class="cell">
					<span class="k">Temp</span>
					<span class="v" id="s-temp">—</span>
				</div>
				<div class="cell">
					<span class="k">Uptime</span>
					<span class="v" id="s-uptime">—</span>
				</div>
				<div class="cell">
					<span class="k">Time</span>
					<span class="v" id="s-clock">—</span>
				</div>
			</section>

			<section class="health-wrap" id="health-wrap" hidden>
				<span class="health-label">Services</span>
				<div class="health" id="health"></div>
			</section>

			<footer class="build" id="build" hidden>
				<a id="build-sha" target="_blank" rel="noopener"></a>
				<span id="build-sep" hidden> · </span>
				<span id="build-date"></span>
			</footer>
		</div>

		<template id="tpl-queue-item">
			<li hidden>
				<div class="q-meta">
					<div class="q-title"></div>
					<div class="q-artist"></div>
				</div>
				<div class="q-dur"></div>
			</li>
		</template>

		<template id="tpl-health">
			<div class="h-item">
				<img class="h-icon" alt="" loading="lazy" />
				<span class="h-dot"></span>
				<div class="h-meta">
					<span class="h-name"></span>
					<span class="h-sub">
						<span data-k="uptime"></span>
						<span data-k="mem"></span>
						<span data-k="restarts"></span>
					</span>
				</div>
				<span class="h-graph"></span>
			</div>
		</template>

		<script src="/app.js" type="module"></script>
	</body>
</html>
