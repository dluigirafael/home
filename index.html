<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<title>Now Playing</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --card: #14181d;
    --border: #222a33;
    --text: #e6e8eb;
    --muted: #7a8794;
    --dim: #5f6b77;
    --accent: #4ea1ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .card {
    width: min(92vw, 620px);
    padding: 2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .h {
    margin: 0 0 1.25rem;
    font-size: .7rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-size: .65rem;
    letter-spacing: .15em;
    color: var(--dim);
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim);
  }
  .dot.playing { background: #3ddc84; box-shadow: 0 0 8px #3ddc8466; }
  .dot.paused { background: #ffb84d; }
  .title {
    font-size: 1.15rem;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: .25rem;
    word-break: break-word;
  }
  .artist {
    color: var(--muted);
    font-size: .9rem;
    margin-bottom: 1.25rem;
    word-break: break-word;
  }
  .progress {
    display: flex;
    align-items: center;
    gap: .75rem;
    font-size: .75rem;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .bar {
    flex: 1;
    height: 4px;
    background: #1d242c;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    background: var(--accent);
    width: 0;
    transition: width .5s linear;
  }
  .empty { color: var(--dim); font-style: italic; }
  .queue {
    margin-top: 1.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }
  .queue h2 {
    margin: 0 0 .85rem;
    font-size: .7rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .queue ol {
    margin: 0;
    padding: 0;
    list-style: none;
    counter-reset: q;
  }
  .queue li {
    counter-increment: q;
    display: flex;
    gap: .85rem;
    padding: .5rem 0;
    border-bottom: 1px solid #1a1f26;
    font-size: .9rem;
  }
  .queue li:last-child { border-bottom: 0; }
  .queue li::before {
    content: counter(q);
    color: var(--dim);
    font-size: .75rem;
    min-width: 1.25rem;
    padding-top: .15rem;
    font-variant-numeric: tabular-nums;
  }
  .q-meta { min-width: 0; flex: 1; }
  .q-title {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .q-artist {
    color: var(--muted);
    font-size: .8rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .q-dur {
    color: var(--dim);
    font-size: .75rem;
    font-variant-numeric: tabular-nums;
    padding-top: .15rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="h">
      <span>Now Playing</span>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">—</span></span>
    </div>

    <div id="now"><span class="empty">Loading…</span></div>

    <div id="queue"></div>
  </div>

<script>
const $now = document.getElementById('now');
const $queue = document.getElementById('queue');
const $dot = document.getElementById('dot');
const $statusText = document.getElementById('statusText');

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(sec) {
  if (sec == null || isNaN(sec)) return '0:00';
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function render(d) {
  const np = d && d.nowPlaying;
  const prog = (d && d.progress) || {};
  const status = (d && d.status) || 'idle';
  const upcoming = (d && d.upcoming) || [];

  $dot.className = 'dot ' + (status === 'playing' ? 'playing' : status === 'paused' ? 'paused' : '');
  $statusText.textContent = status;

  if (!np) {
    $now.innerHTML = '<span class="empty">Nothing playing</span>';
  } else {
    const pos = prog.position || 0;
    const dur = prog.duration || np.duration || 0;
    const pct = dur > 0 ? Math.min(100, (pos / dur) * 100) : 0;

    $now.innerHTML =
      '<div class="title">' + esc(np.title || 'Unknown') + '</div>' +
      (np.artist ? '<div class="artist">' + esc(np.artist) + '</div>' : '') +
      '<div class="progress">' +
        '<span>' + fmt(pos) + '</span>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<span>' + fmt(dur) + '</span>' +
      '</div>';
  }

  if (upcoming.length) {
    const total = d.queueLength || upcoming.length;
    $queue.innerHTML =
      '<div class="queue"><h2>Up Next · ' + total + '</h2><ol>' +
      upcoming.slice(0, 5).map(i =>
        '<li>' +
          '<div class="q-meta">' +
            '<div class="q-title">' + esc(i.title || 'Unknown') + '</div>' +
            (i.artist ? '<div class="q-artist">' + esc(i.artist) + '</div>' : '') +
          '</div>' +
          (i.duration ? '<div class="q-dur">' + fmt(i.duration) + '</div>' : '') +
        '</li>'
      ).join('') +
      '</ol></div>';
  } else {
    $queue.innerHTML = '';
  }
}

async function tick() {
  try {
    const r = await fetch('/data');
    if (!r.ok) throw 0;
    render(await r.json());
  } catch {
    $now.innerHTML = '<span class="empty">Unavailable</span>';
    $queue.innerHTML = '';
    $dot.className = 'dot';
    $statusText.textContent = '—';
  }
}

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
